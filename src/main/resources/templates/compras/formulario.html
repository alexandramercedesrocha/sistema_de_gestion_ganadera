<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo Lote de Compra')}"></head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="header-actions">
            <div>
                <h1 class="page-title"><i class="fa-solid fa-cart-plus"></i> Registrar Nuevo Lote de Compra</h1>
                <p class="page-subtitle">Paso 1: Configurar fecha, proveedor y precios pactados del lote en Córdobas (C$)</p>
            </div>
            <div>
                <a th:href="@{/compras}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Volver a Compras</a>
            </div>
        </div>

        <div class="form-card form-container-card">
            <form th:action="@{/compras/guardar}" th:object="${lote}" method="post">

                <div class="form-group mb-lg">
                    <label class="form-label-primary">
                        <i class="fa-solid fa-calendar"></i> Fecha de Compra:
                    </label>
                    <input type="date" th:field="*{fechaCompra}"class="form-control form-input-control" required>
                </div>

                <div class="form-group mb-lg">
                    <label class="form-label-primary">
                        <i class="fa-solid fa-user-tag"></i> Proveedor / Hacienda Vendedora:
                    </label>
                    <select name="idProveedor"class="form-control form-input-control" required>
                        <option value="" disabled selected>-- Seleccione el proveedor registrado --</option>
                        <option th:each="p : ${proveedores}" 
                                th:value="${p.idProveedor}" 
                                th:text="${p.nombre}">Don Chepe Miranda</option>
                    </select>
                    <small class="text-muted-xs">
                        ¿No encuentras el proveedor? Puedes registrarlo en la sección de <a th:href="@{/catalogos(tab='proveedores')}" target="_blank">Catálogos &rarr;</a>
                    </small>
                </div>

                <div class="grid-two-cols mb-xl">
                    <div class="form-group">
                        <label class="form-label-primary">
                            <i class="fa-solid fa-coins"></i> Precio Estándar (C$ por kg):
                        </label>
                        <input type="number" step="0.01" th:field="*{precioEstandar}"class="form-control form-input-control" placeholder="Ej. 75.00" required>
                        <small class="text-muted-xs">Precio base pactado por kilo en pie</small>
                    </div>

                    <div class="form-group">
                        <label class="form-label-primary">
                            <i class="fa-solid fa-triangle-exclamation"></i> Precio de Rechazo (C$ por kg):
                        </label>
                        <input type="number" step="0.01" th:field="*{precioDeRechazo}"class="form-control form-input-control" placeholder="Ej. 65.00">
                        <small class="text-muted-xs">Precio castigado en caso de animal con defecto</small>
                    </div>
                </div>

                <div class="form-footer-actions">
                    <a th:href="@{/compras}" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-check"></i> Guardar Lote y Registrar Aretes &rarr;
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
