<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrar Compra')}"></head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="header-actions">
            <div>
                <h1 class="page-title"><i class="fa-solid fa-cart-plus"></i> Registrar Compra de Ganado</h1>
                <p class="page-subtitle">Ingreso de lote adquirido a productor o subasta ganadera</p>
            </div>
            <a th:href="@{/compras}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Volver a Compras</a>
        </div>

        <div class="form-card">
            <form th:action="@{/compras/guardar}" th:object="${compra}" method="post">
                <div class="form-grid">

                    <div class="form-group">
                        <label for="fechaCompra">Fecha de la Compra *</label>
                        <input type="date" id="fechaCompra" th:field="*{fechaCompra}" required>
                    </div>

                    <div class="form-group">
                        <label for="proveedor">Proveedor / Ganadero *</label>
                        <input type="text" id="proveedor" th:field="*{proveedor}" placeholder="Ej. Don Chepe Miranda (Hacienda La Gloria)" required>
                    </div>

                    <div class="form-group">
                        <label for="totalCabezas">Total de Cabezas *</label>
                        <input type="number" id="totalCabezas" th:field="*{totalCabezas}" placeholder="Ej. 20" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="totalKilos">Total de Kilos en Báscula *</label>
                        <input type="number" step="0.01" id="totalKilos" th:field="*{totalKilos}" placeholder="Ej. 8450.00" required>
                    </div>

                    <div class="form-group">
                        <label for="precioKg">Precio por Kilo ($) *</label>
                        <input type="number" step="0.01" id="precioKg" th:field="*{precioKg}" placeholder="Ej. 2.15" required>
                    </div>

                    <div class="form-group">
                        <label for="precioEstandar">Precio Estándar de Referencia ($)</label>
                        <input type="number" step="0.01" id="precioEstandar" th:field="*{precioEstandar}" placeholder="Ej. 2.10">
                    </div>

                    <div class="form-group">
                        <label for="montoTotal">Monto Total de la Compra ($) *</label>
                        <input type="number" step="0.01" id="montoTotal" th:field="*{montoTotal}" placeholder="Auto-calculado o manual" required>
                    </div>

                    <div class="form-group full-width">
                        <label for="direccion">Dirección / Lugar de la Compra *</label>
                        <input type="text" id="direccion" th:field="*{direccion}" placeholder="Ej. Finca San Jerónimo, Teustepe, Boaco" required>
                    </div>

                </div>

                <div class="form-actions">
                    <a th:href="@{/compras}" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Guardar Compra</button>
                </div>
            </form>
        </div>

    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
