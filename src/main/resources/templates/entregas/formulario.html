<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nueva Entrega a Matadero')}"></head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="header-actions">
            <div>
                <h1 class="page-title"><i class="fa-solid fa-industry"></i> Registrar Entrega a Matadero</h1>
                <p class="page-subtitle">Paso 1: Configurar el despacho hacia la planta faenadora y precios pactados en Córdobas (C$)</p>
            </div>
            <div>
                <a th:href="@{/entregas}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Volver al Listado</a>
            </div>
        </div>

        <div class="form-card" class="form-container-card">
            <form th:action="@{/entregas/guardar}" th:object="${entrega}" method="post">

                <div class="form-group" class="mb-lg">
                    <label class="form-label-primary">
                        <i class="fa-solid fa-calendar"></i> Fecha de Entrega:
                    </label>
                    <input type="date" th:field="*{fechaEntrega}" class="form-control" required 
                           class="form-input-control">
                </div>

                <div class="form-group" class="mb-lg">
                    <label class="form-label-primary">
                        <i class="fa-solid fa-building"></i> Planta / Matadero Receptor:
                    </label>
                    <select name="idMatadero" class="form-control" required
                            class="form-input-control">
                        <option value="" disabled selected>-- Seleccione el matadero destino --</option>
                        <option th:each="mat : ${mataderos}" 
                                th:value="${mat.idMatadero}" 
                                th:text="${mat.nombreMatadero}">MACESA</option>
                    </select>
                </div>

                <div class="grid-two-cols mb-xl">
                    <div class="form-group">
                        <label class="form-label-primary">
                            <i class="fa-solid fa-coins"></i> Precio Acordado (C$ por kg canal):
                        </label>
                        <input type="number" step="0.01" th:field="*{precioAcordado}" class="form-control" placeholder="Ej. 125.00" required
                               class="form-input-control">
                        <small class="text-muted-xs">Precio pactado para ganado de calidad Apta</small>
                    </div>

                    <div class="form-group">
                        <label class="form-label-primary">
                            <i class="fa-solid fa-triangle-exclamation"></i> Precio de Rechazo (C$ por kg):
                        </label>
                        <input type="number" step="0.01" th:field="*{precioRechazo}" class="form-control" placeholder="Ej. 95.00"
                               class="form-input-control">
                        <small class="text-muted-xs">Precio liquidado en caso de dictamen de decomiso o daño</small>
                    </div>
                </div>

                <div class="form-footer-actions">
                    <a th:href="@{/entregas}" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-check"></i> Continuar al Registro de Pesajes &rarr;
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
