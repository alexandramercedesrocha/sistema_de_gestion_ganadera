<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviso del Sistema - Sociedad Ganadera Rocha & Altamirano</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="error-page-body">

    <div class="error-container">
        <div class="error-icon">
            <i class="fa-solid fa-shield-cat fa-cow"></i>
            <i class="fa-solid fa-triangle-exclamation error-icon-sub"></i>
        </div>

        <h1 class="error-title">Atención en el Sistema Ganadero</h1>
        <p class="error-msg" th:text="${errorMessage != null ? errorMessage : (message != null ? message : 'Ocurrió un evento inesperado al procesar la última acción en la base de datos.')}">
            Ocurrió un evento inesperado al procesar la última acción en la base de datos.
        </p>

        <div class="error-actions">
            <a th:href="@{/}" class="btn btn-primary">
                <i class="fa-solid fa-house"></i> Volver al Panel de Control
            </a>
            <button onclick="window.history.back();" class="btn btn-outline btn-outline-primary">
                <i class="fa-solid fa-arrow-left"></i> Reintentar / Regresar
            </button>
        </div>

        <details class="error-details" th:if="${status != null or exception != null or trace != null}">
            <summary><i class="fa-solid fa-code"></i> Información técnica para soporte</summary>
            <div class="error-technical-box">
                <p th:if="${status != null}"><strong>Código HTTP:</strong> <span th:text="${status}">500</span></p>
                <p th:if="${error != null}"><strong>Error:</strong> <span th:text="${error}">Internal Server Error</span></p>
                <p th:if="${path != null}"><strong>Ruta:</strong> <span th:text="${path}">/</span></p>
                <p th:if="${exception != null}"><strong>Excepción:</strong> <span th:text="${exception}">java.lang.Exception</span></p>
            </div>
        </details>
    </div>

</body>
</html>
