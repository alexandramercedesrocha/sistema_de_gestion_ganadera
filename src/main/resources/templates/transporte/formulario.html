<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registrar Viaje de Transporte')}"></head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="header-actions">
            <div>
                <h1 class="page-title"><i class="fa-solid fa-truck-moving"></i> Registrar Servicio de Transporte</h1>
                <p class="page-subtitle">Control de acarreo, ruta y liquidación de fletes ganaderos</p>
            </div>
            <a th:href="@{/transporte}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Volver a Transporte</a>
        </div>

        <div class="form-card">
            <form th:action="@{/transporte/guardar}" th:object="${transporte}" method="post">
                <div class="form-grid">

                    <div class="form-group">
                        <label for="fechaViaje">Fecha del Viaje *</label>
                        <input type="date" id="fechaViaje" th:field="*{fechaViaje}" required>
                    </div>

                    <div class="form-group">
                        <label for="nombreTransportista">Nombre del Transportista / Camión *</label>
                        <input type="text" id="nombreTransportista" th:field="*{nombreTransportista}" placeholder="Ej. Transportes Hernández (Rastra 32 pies)" required>
                    </div>

                    <div class="form-group">
                        <label for="origen">Lugar de Origen *</label>
                        <input type="text" id="origen" th:field="*{origen}" placeholder="Ej. Finca Santa Elena (Teustepe)" required>
                    </div>

                    <div class="form-group">
                        <label for="destino">Lugar de Destino *</label>
                        <input type="text" id="destino" th:field="*{destino}" placeholder="Ej. MACESA - Juigalpa, Chontales" required>
                    </div>

                    <div class="form-group">
                        <label for="costoViaje">Costo del Viaje / Flete ($) *</label>
                        <input type="number" step="0.01" id="costoViaje" th:field="*{costoViaje}" placeholder="Ej. 650.00" required>
                    </div>

                    <div class="form-group">
                        <label for="estadoPago">Estado de Pago *</label>
                        <select id="estadoPago" th:field="*{estadoPago}" required>
                            <option value="Pendiente">Pendiente</option>
                            <option value="Pagado">Pagado</option>
                        </select>
                    </div>

                </div>

                <div class="form-actions">
                    <a th:href="@{/transporte}" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Guardar Servicio</button>
                </div>
            </form>
        </div>

    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
