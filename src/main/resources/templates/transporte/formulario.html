<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nuevo Viaje de Transporte')}"></head>
<body>

    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <main class="container">
        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="header-actions">
            <div>
                <h1 class="page-title"><i class="fa-solid fa-truck"></i> Registrar Nuevo Viaje de Transporte</h1>
                <p class="page-subtitle">Asignar ruta de traslado, camión jaula y chofer responsable</p>
            </div>
            <div>
                <a th:href="@{/transporte}" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Volver a Transporte</a>
            </div>
        </div>

        <div class="form-card" class="form-container-card">
            <form th:action="@{/transporte/guardar}" th:object="${viaje}" method="post">

                <div class="grid-two-cols mb-lg">
                    <div class="form-group">
                        <label class="form-label-primary">
                            <i class="fa-solid fa-location-dot"></i> Ubicación de Origen:
                        </label>
                        <select name="idOrigen" class="form-control" required
                                class="form-input-control">
                            <option value="" disabled selected>-- Seleccione punto de partida --</option>
                            <option th:each="u : ${ubicaciones}" 
                                    th:value="${u.idUbicacion}" 
                                    th:text="${u.nombreLugar} + ' (' + ${u.tipoLugar} + ')'">Finca Santa Elena</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label-primary">
                            <i class="fa-solid fa-map-pin"></i> Ubicación de Destino:
                        </label>
                        <select name="idDestino" class="form-control" required
                                class="form-input-control">
                            <option value="" disabled selected>-- Seleccione destino final --</option>
                            <option th:each="u : ${ubicaciones}" 
                                    th:value="${u.idUbicacion}" 
                                    th:text="${u.nombreLugar} + ' (' + ${u.tipoLugar} + ')'">MACESA (Juigalpa)</option>
                        </select>
                    </div>
                </div>

                <div class="grid-two-cols mb-lg">
                    <div class="form-group">
                        <label class="form-label-primary">
                            <i class="fa-solid fa-id-card"></i> Conductor Asignado:
                        </label>
                        <select name="cedulaConductor" class="form-control" required
                                class="form-input-control">
                            <option value="" disabled selected>-- Seleccione chofer --</option>
                            <option th:each="c : ${conductores}" 
                                    th:value="${c.cedula}" 
                                    th:text="${c.nombre} + ' (' + ${c.cedula} + ')'">Marvin Centeno</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label-primary">
                            <i class="fa-solid fa-truck"></i> Camión / Placa:
                        </label>
                        <select name="numPlaca" class="form-control" required
                                class="form-input-control">
                            <option value="" disabled selected>-- Seleccione camión --</option>
                            <option th:each="cam : ${camiones}" 
                                    th:value="${cam.numPlaca}" 
                                    th:text="'Placa: ' + ${cam.numPlaca}">CH-18290</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" class="mb-xl">
                    <label class="form-label-primary">
                        <i class="fa-solid fa-clock"></i> Estado de Pago del Flete:
                    </label>
                    <select th:field="*{estadoPago}" class="form-control"
                            class="form-input-control">
                        <option value="Pendiente">Pendiente de Pago</option>
                        <option value="Pagado">Pagado</option>
                    </select>
                </div>

                <div class="form-footer-actions">
                    <a th:href="@{/transporte}" class="btn btn-outline">Cancelar</a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fa-solid fa-floppy-disk"></i> Guardar Viaje
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
