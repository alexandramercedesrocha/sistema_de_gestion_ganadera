# ==============================================================================
# CONFIGURACIÓN DEL SERVIDOR Y APLICACIÓN
# ==============================================================================
server.port=8080
spring.application.name=ganaderia-rocha-altamirano

# Importación opcional de archivo local para contraseñas privadas (ignorado en Git)
spring.config.import=optional:file:./application-local.properties,optional:classpath:application-local.properties

# ==============================================================================
# CONEXIÓN A BASE DE DATOS MYSQL (COMPATIBLE CON CUALQUIER CONFIGURACIÓN)
# Valores por defecto para XAMPP: localhost:3306, BD: sgg, usuario: root, clave: ""
# Cada compañero puede sobreescribir con variables de entorno:
# DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# O con SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
# ==============================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sgg}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ==============================================================================
# CONFIGURACIÓN DE THYMELEAF
# ==============================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ==============================================================================
# SUBIDA DE FOTOS Y ARCHIVOS (GALERIA / CAMARA)
# ==============================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
server.error.whitelabel.enabled=false
server.error.include-message=always

# ==============================================================================
# DATOS DE LA SOCIEDAD COMERCIAL GANADERA (NICARAGUA - CÓRDOBAS)
# ==============================================================================
sociedad.empresa.nombre=Sociedad Ganadera Rocha & Altamirano
sociedad.socio1.nombre=Wilber Rocha
sociedad.socio1.porcentaje=50
sociedad.socio2.nombre=Yader Altamirano
sociedad.socio2.porcentaje=50
sociedad.moneda=C$
