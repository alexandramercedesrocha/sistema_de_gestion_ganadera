# Configuración del Servidor y Aplicación
server.port=8080
spring.application.name=ganaderia-rocha-altamirano

# Configuración de Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Datos de la Sociedad Comercial Ganadera
sociedad.empresa.nombre=Sociedad Ganadera Rocha & Altamirano
sociedad.socio1.nombre=Wilber Rocha
sociedad.socio1.porcentaje=50
sociedad.socio2.nombre=Yader Altamirano
sociedad.socio2.porcentaje=50
sociedad.moneda=USD
